<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포챔스 오버레이</title>
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;
  font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:13px;color:#e8edf2;
  -webkit-user-select:none;width:100vw;height:100vh}
#hud{position:fixed;top:60px;left:16px;width:auto;max-height:85vh;overflow:hidden auto;
  background:rgba(13,17,22,.86);border:1px solid #2e3947;border-radius:10px;padding:10px;
  backdrop-filter:blur(2px);display:none}
#wrap{display:flex;gap:10px;align-items:flex-start}
#content{width:290px;flex:none}
#detail{width:288px;flex:none;display:none}
#hud.detail #detail{display:block;border-left:1px solid #2e3947;padding-left:10px}
#hud.on{display:block}
#hud.hot{border-color:#4da3ff;box-shadow:0 0 0 1px #4da3ff} /* 커서가 HUD 위 = 조작(드래그) 가능 */
#hud h3{font-size:12px;color:#93a1b0;margin:0 0 6px;letter-spacing:.05em}
#dragbar{cursor:move;padding:4px 0;color:#4da3ff;font-weight:700;font-size:12px;display:flex;gap:6px;align-items:center}
#mode{background:#222a35;border-radius:4px;padding:1px 7px;font-size:11px}
.roleRow{display:flex;gap:8px;align-items:center;border-top:1px solid #232c37;padding:5px 0}
.roleRow img{width:34px;height:34px;background:#1a2028;border-radius:6px}
.roleRow .nm{font-weight:700}
.roleRow .rl{font-size:12px}
.rl.phys{color:#ff8c5d}.rl.spec{color:#6db8ff}.rl.wall{color:#4ade80}.rl.sup{color:#facc15}
.tags{font-size:11px;color:#93a1b0}
.spd{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.spd span{padding:2px 7px;border-radius:4px;font-size:11px;background:#222a35}
.spd .win{background:#123b26;color:#4ade80}.spd .lose{background:#3f1a1f;color:#ff5d5d}.spd .tie{background:#3a3312;color:#facc15}
.ko1{color:#ff5d5d;font-weight:700}.ko2{color:#facc15}.ko3{color:#93a1b0}
.dmgRow{display:grid;grid-template-columns:1fr auto;gap:4px;border-top:1px solid #232c37;padding:3px 0;font-size:12px}
.small{font-size:11px;color:#93a1b0}
/* 팀 등록 패널 */
.tteam{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.tchip{display:flex;align-items:center;gap:3px;background:#1a2028;border-radius:6px;padding:2px 6px 2px 2px;font-size:11px}
.tchip img{width:24px;height:24px}
.ttype{color:#8fb7e8;font-size:10px;margin-left:2px}
.tprompt{margin:6px 0 4px;font-size:12px;color:#e8edf2}
.tprompt.ok{color:#4ade80}
.twarn{margin:6px 0;font-size:12px;color:#facc15;background:#3a3312;border-radius:6px;padding:6px 8px;line-height:1.5}
.tbtns{display:flex;gap:6px;margin:4px 0}
.tbtn{background:#222a35;border:1px solid #2e3947;color:#e8edf2;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.tbtn:hover{border-color:#4da3ff}
.tbtn.ok{background:#123b26;border-color:#2f7d4f;color:#7cf0a8}
.tbtn.ok:hover{border-color:#4ade80}
.tbtn.del{padding:3px 9px;font-size:11px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #232c37;padding:4px 0}
.trow.act .tnm{color:#4ade80;font-weight:700}
.tnm{font-size:12px}
/* 세트 상세 캐러셀 */
.dv{margin-top:2px}
.dvhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dvpos{flex:1;text-align:center;font-size:12px;color:#93a1b0}
.dvmon{display:flex;gap:10px;align-items:center;border-top:1px solid #232c37;padding-top:6px}
.dvmon img{width:52px;height:52px;background:#1a2028;border-radius:8px}
.dvmon .nm{font-weight:700;font-size:14px}
.megab{background:#3a2a5e;border:1px solid #7a5cff;color:#c9b8ff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:5px;vertical-align:middle}
.megasel{display:flex;gap:6px;margin:5px 0}
.megabtn{flex:1;background:#20182e;border:1px solid #4a3a6e;color:#b7a8d8;font-size:11px;font-weight:600;padding:4px 6px;border-radius:6px;cursor:pointer}
.megabtn.act{background:#5a3ca8;border-color:#9a7cff;color:#fff}
.dvstats{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin:7px 0}
.dvst{display:flex;align-items:baseline;gap:6px;font-size:12px}
.dvlab{width:44px;color:#93a1b0}
.dvnum{font-weight:700;min-width:30px;text-align:right}
.dvev{font-size:10px;color:#6f9ff0}
.dvitem{font-size:12px;color:#e8edf2;margin-top:4px;padding-top:4px;border-top:1px solid #232c37}
.small.ok{color:#7cf0a8}
.small.dim{color:#5a6675;margin-top:6px}
/* 팀 헤더 + 재인식 버튼 */
.thead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.thead h3{margin:0}
.ricon{background:#222a35;border:1px solid #2e3947;color:#8fb7e8;width:24px;height:24px;
  border-radius:50%;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;
  justify-content:center;padding:0;flex:none;transition:transform .25s,border-color .15s,color .15s}
.ricon:hover{border-color:#4da3ff;color:#cfe4ff;transform:rotate(180deg)}
.pinnote{color:#facc15;margin:2px 0 4px}
/* 클릭 가능한 칩·팀행 */
.tchip{cursor:pointer;transition:background .12s}
.tchip:hover{background:#242d38}
.tchip.sel{outline:1px solid #4da3ff;outline-offset:-1px;background:#20303f}
.tnm{cursor:pointer}
.tnm:hover{color:#cfe4ff}
.trow.pin .tnm{color:#facc15;font-weight:700}
/* 세트 상세 확장 패널(옆칸) */
.tbtn.nav{padding:3px 9px}
.dsec{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #232c37;padding:4px 0;font-size:12px}
.dseclab{color:#93a1b0}
.dsecval{font-weight:600;text-align:right}
.dsecval.dim{color:#5a6675;font-weight:400}
.dvmoves{display:grid;gap:3px;margin:4px 0}
.dmove{background:#1a2028;border-radius:5px;padding:3px 7px;font-size:11px;display:flex;align-items:center;gap:5px}
.dmove.dim{color:#5a6675}
.mvt{color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;flex:none}
.edsub{color:#93a1b0;font-size:10px;font-weight:400}
/* 편집 가능한 값 = 버튼처럼 보이게(테두리+배경+✎ 표시) */
.editable{cursor:pointer;transition:background .12s,border-color .12s}
.dsec.editable,.dmove.editable{background:#182231;border:1px solid #2f3f52;border-radius:6px;padding:5px 8px;margin:3px 0}
.dsec.editable:hover,.dmove.editable:hover{background:#22303f;border-color:#4da3ff}
.dsecright{display:flex;align-items:center;gap:6px}
.edmark{color:#5a6f88;font-size:11px;flex:none}
.dmove .edmark{margin-left:auto}
.dsec.editable:hover .edmark,.dmove.editable:hover .edmark{color:#7fc0ff}
.dvev.editable{cursor:pointer;color:#6f9ff0;border:1px solid #34506e;background:#16202c;border-radius:5px;padding:0 6px}
.dvev.editable:hover{border-color:#6f9ff0;background:#1c2b3d}
/* 능력치 헤더행 + 미니 버튼 */
.dsecrow{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.tbtn.mini{padding:2px 8px;font-size:10px}
.edbudget{margin-bottom:6px}
.evwarn{color:#ff8a8a;font-size:11px;min-height:15px;margin:2px 0;line-height:1.3}
/* 인라인 편집기 */
.ed{margin-top:0}
.edhead{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.edtitle{font-weight:700;font-size:12px}
.ed input{width:100%;box-sizing:border-box;background:#0a0d10;border:1px solid #2e3947;color:#e8edf2;padding:6px 8px;border-radius:6px;font-size:12px;outline:none}
.ed input:focus{border-color:#4da3ff}
.edlist{max-height:320px;overflow-y:auto;margin-top:6px;display:flex;flex-direction:column;gap:2px}
.edopt{padding:5px 8px;border-radius:5px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:5px}
.edopt:hover{background:#20303f}
.edev{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.edev input{text-align:center}
.edevq{display:flex;align-items:center;gap:6px;margin-bottom:8px}
/* 재스캔 충돌 프롬프트 */
.tconf{background:#3a2a12;border:1px solid #a9781f;border-radius:6px;padding:7px 9px;margin:6px 0}
.tconf-h{color:#facc15;font-size:12px;font-weight:700;margin-bottom:4px}
.tconf-r{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:2px 0}
.tconf-l{color:#93a1b0}
.cf-old{color:#ff8a8a}.cf-new{color:#4ade80;font-weight:700}
#toast{position:fixed;bottom:24px;left:16px;background:rgba(13,17,22,.86);border:1px solid #2e3947;
  border-radius:8px;padding:6px 12px;font-size:12px;color:#93a1b0;display:none}
</style>
</head>
<body>
<div id="hud">
  <div id="dragbar">⬤ 포챔스 오버레이 <span id="mode">대기</span><span class="small" id="conf"></span></div>
  <div id="wrap">
    <div id="content"></div>
    <div id="detail"></div>
  </div>
</div>
<div id="toast"></div>
<video id="cap" style="display:none" autoplay muted></video>
<canvas id="work" style="display:none"></canvas>

<!-- data/spriteindex는 window 직접 할당이라 <script>로 로드. engine/analyzer/matcher/screen-classifier는
     nodeIntegration UMD 함정(module 정의됨→window 미부착) 때문에 overlay.js에서 require로 로드. -->
<script src="../data.js"></script>
<script src="../moves-ko-fix.js"></script>
<script src="../items-ko-fix.js"></script>
<script src="../spriteindex.js"></script>
<script src="../learnsets.js"></script>
<script src="../field-effects.js"></script>
<!-- 오버레이 스크립트 3분할(트랙별 담당, 동시편집 충돌 방지) — 코어 먼저 로드해야 전역 유틸이 준비됨.
     overlay.js=코어(캡처·분류·틱) / overlay-battle.js=선출·배틀 / overlay-team.js=팀 등록·세트 편집 -->
<script src="overlay.js"></script>
<script src="overlay-battle.js"></script>
<script src="overlay-team.js"></script>
</body>
</html>
